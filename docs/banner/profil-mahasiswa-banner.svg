<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Profil Mahasiswa</title>
  <desc id="description">Banner proyek Profil Mahasiswa dengan ilustrasi kartu identitas berwarna biru dan hijau.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#1F4E79"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#326B65"/>
      <stop offset="1" stop-color="#58A89E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06111D" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="30" fill="url(#background)"/>
  <circle cx="1160" cy="54" r="170" fill="#A5C8EC" opacity=".08"/>
  <circle cx="1030" cy="390" r="230" fill="#BCECE4" opacity=".06"/>

  <g transform="translate(78 70)" filter="url(#shadow)">
    <rect width="330" height="280" rx="30" fill="#F7F9FC"/>
    <rect width="330" height="20" rx="10" fill="url(#accent)"/>
    <circle cx="105" cy="118" r="58" fill="#D6E4F0" stroke="#1F4E79" stroke-width="7"/>
    <circle cx="105" cy="101" r="18" fill="#326B65"/>
    <path d="M64 157c4-29 20-43 41-43s37 14 41 43z" fill="#326B65"/>
    <rect x="190" y="78" width="90" height="12" rx="6" fill="#1F4E79"/>
    <rect x="190" y="110" width="72" height="12" rx="6" fill="#326B65"/>
    <rect x="190" y="142" width="96" height="12" rx="6" fill="#1F4E79" opacity=".7"/>
    <rect x="52" y="210" width="228" height="14" rx="7" fill="#D6E4F0"/>
    <rect x="52" y="242" width="176" height="14" rx="7" fill="#BCECE4"/>
  </g>

  <g fill="#F7F9FC" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="480" y="150" font-size="66" font-weight="700" letter-spacing="-1">Profil Mahasiswa</text>
    <text x="484" y="212" font-size="28" font-weight="500" fill="#D1E4FF">Kotlin • Jetpack Compose • Material 3</text>
    <rect x="484" y="258" width="168" height="44" rx="22" fill="#BCECE4" opacity=".95"/>
    <text x="511" y="288" font-size="19" font-weight="700" fill="#0B211E">Android Portfolio</text>
    <text x="484" y="342" font-size="20" fill="#A5C8EC">Proyek akademik dengan arsitektur Compose yang teruji</text>
  </g>
</svg>
